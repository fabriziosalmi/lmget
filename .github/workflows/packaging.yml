name: packaging

# The Scoop manifest in bucket/ installs the release it names, on Windows,
# with Scoop itself (installed from its installer at a fixed commit). The
# Python wheels scripts/wheels.py builds from a release install with pip and
# with uv on every platform they are for.

on:
  pull_request:
    paths: ['bucket/**', 'scripts/scoop-manifest.py', 'scripts/wheels.py', '.github/workflows/packaging.yml']
  push:
    branches: [main]
    paths: ['bucket/**', 'scripts/scoop-manifest.py', 'scripts/wheels.py', '.github/workflows/packaging.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lmget from this repository's Scoop manifest
        shell: pwsh
        run: |
          $installer = 'https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1'
          iex "& {$(irm $installer)} -RunAsAdmin"
          $env:PATH = (Join-Path $HOME 'scoop\shims') + ';' + $env:PATH
          # scoop bucket add needs a git URL, which is main once merged: here
          # the manifest file itself, which is what the bucket serves
          scoop install (Join-Path $env:GITHUB_WORKSPACE 'bucket\lmget.json')
          $want = 'lmget v' + (Get-Content bucket/lmget.json -Raw | ConvertFrom-Json).version
          $got = lmget --version
          if ($got -ne $want) { throw "installed: $got, want $want" }
          Write-Host "scoop installed $got"

  wheels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the wheels of the latest release, from its archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern checksums.txt --dir archives
          python3 scripts/wheels.py "$tag" archives wheels
          python3 scripts/wheels.py "$tag" archives wheels-again
          for f in wheels/*.whl; do cmp "$f" "wheels-again/$(basename "$f")"; done # the same archives, the same bytes
          python3 -m venv venv
          venv/bin/pip install --quiet twine==6.1.0
          venv/bin/twine check --strict wheels/*.whl
          echo "$tag" > wheels/TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: wheels/
          retention-days: 1

  wheel-install:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip and uv install the wheel for this platform, and only it
        shell: bash
        run: |
          want="lmget $(cat wheels/TAG)"
          python -m venv venv
          if [ "$RUNNER_OS" = Windows ]; then bin=venv/Scripts; else bin=venv/bin; fi
          "$bin/python" -m pip install --no-index --find-links wheels lmget
          got=$("$bin/lmget" --version)
          [ "$got" = "$want" ] || { echo "pip: $got, want $want"; exit 1; }
          uv tool install --offline --no-index --find-links wheels lmget
          got=$("$(uv tool dir --bin)/lmget" --version)
          [ "$got" = "$want" ] || { echo "uv: $got, want $want"; exit 1; }
          echo "pip and uv installed $got"
