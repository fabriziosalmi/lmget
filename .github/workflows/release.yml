name: release

# A pushed tag v* builds the archives, attests their build provenance
# (SLSA, signed through Sigstore) and creates a DRAFT release. A person
# publishes it after reading it.
#
# Two jobs: "build" runs the repository's code (tests, build) with a
# read-only token and no way to sign; "release" holds the permissions to
# sign and to write, and runs no repository code: it only checks that the
# archives are the ones built and that the tag still names the built commit.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOFLAGS: -tags=purego_utp # pure Go uTP in anacrolix: no C++ compiler, as shipped

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: tests with the race detector
        run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      checksums: ${{ steps.sums.outputs.checksums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # in a job of its own, after the tests: no test code runs in the
      # workspace the archives are built in
      - name: build the archives
        run: ./scripts/release-build.sh "$GITHUB_REF_NAME" dist
      - name: checksums as a job output
        id: sums
        run: |
          {
            echo 'checksums<<EOF'
            cat dist/checksums.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the provenance
      attestations: write  # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: the archives are the ones the build job hashed
        env:
          BUILT: ${{ needs.build.outputs.checksums }}
        run: |
          printf '%s\n' "$BUILT" > built.txt
          cmp built.txt dist/checksums.txt
          (cd dist && sha256sum -c checksums.txt)
      - name: the tag still names the built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r typ sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          if [ "$typ" = tag ]; then # an annotated tag: the commit it points at
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          fi
          now=$sha
          if [ "$now" != "$GITHUB_SHA" ]; then
            echo "tag $GITHUB_REF_NAME moved to $now, the archives were built from $GITHUB_SHA" >&2
            exit 1
          fi
      # required for a public repository; on a private one its availability
      # depends on the plan, so a failure there is recorded, not fatal
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: ${{ github.event.repository.private }}
        with:
          subject-checksums: dist/checksums.txt
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          mapfile -t assets < <(awk '{print $2}' checksums.txt) # exactly the archives hashed by the build job
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" checksums.txt \
            --draft --verify-tag --target "$GITHUB_SHA" --title "lmget $GITHUB_REF_NAME" \
            --notes "Verify an archive: gh attestation verify <archive> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/$GITHUB_REF_NAME"

  image:
    # the container image, from the same checked archives: the binaries in
    # it are the ones the release ships. The Dockerfile only copies them onto
    # a base fixed by digest, so this job runs no repository code either.
    needs: [build, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # sign the provenance
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Dockerfile
            .dockerignore
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: archives
      - name: the archives are the ones the build job hashed
        env:
          BUILT: ${{ needs.build.outputs.checksums }}
        run: |
          printf '%s\n' "$BUILT" > built.txt
          cmp built.txt archives/checksums.txt
          (cd archives && sha256sum -c checksums.txt)
      - name: the Linux binaries, out of their archives
        run: |
          v=${GITHUB_REF_NAME#v}
          for arch in amd64 arm64; do
            mkdir -p "dist/linux_$arch"
            tar -xzf "archives/lmget_${v}_linux_${arch}.tar.gz" -C "dist/linux_$arch" --strip-components=1 "lmget_${v}_linux_${arch}/lmget"
          done
          test "$(dist/linux_amd64/lmget --version)" = "lmget $GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: image name
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false # the attestation below is the one gh verifies
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
