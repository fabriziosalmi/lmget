name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -tags=purego_utp # pure Go uTP in anacrolix: no C++ compiler, as shipped

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: vet and gofmt
        run: |
          go vet ./...
          test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: tests with the race detector
        run: go test -race -count=1 ./...
      - name: release build is reproducible
        run: |
          ./scripts/release-build.sh v0.0.0 dist-a
          ./scripts/release-build.sh v0.0.0 dist-b
          cmp dist-a/checksums.txt dist-b/checksums.txt
      - name: lmget builds for the BSDs (built, not released)
        run: |
          for t in freebsd/amd64 openbsd/amd64 netbsd/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/lmget
          done

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test -count=1 ./...
      - name: builds for arm64 too
        env:
          GOARCH: arm64
        run: go build -o NUL ./cmd/lmget
      - name: install.ps1 installs a verified archive and refuses a bad one
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'lmget_0.0.0-ci_windows_amd64'
          $rel = Join-Path $env:RUNNER_TEMP 'rel'
          New-Item -ItemType Directory -Force (Join-Path $rel $name) | Out-Null
          go build -trimpath -ldflags "-X github.com/fabriziosalmi/lmget.Version=v0.0.0-ci" -o (Join-Path $rel "$name\lmget.exe") ./cmd/lmget
          tar -czf (Join-Path $rel "$name.tar.gz") -C $rel $name
          $h = (Get-FileHash -Algorithm SHA256 (Join-Path $rel "$name.tar.gz")).Hash.ToLowerInvariant()
          "$h  $name.tar.gz" | Set-Content -Encoding ascii (Join-Path $rel 'checksums.txt')
          $srv = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',$rel -PassThru
          # wait until the server answers, not a fixed time: a slow runner once took longer than 3 s
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { Invoke-WebRequest -Uri 'http://127.0.0.1:8765/checksums.txt' -UseBasicParsing | Out-Null; $up = $true }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $up) { throw 'the test server did not start in 30 s' }
          $env:LMGET_VERSION = 'v0.0.0-ci'
          $env:LMGET_RELEASE_URL = 'http://127.0.0.1:8765'
          $env:LMGET_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          ./site/install.ps1
          $v = & (Join-Path $env:LMGET_INSTALL_DIR 'lmget.exe') --version
          if ($v -ne 'lmget v0.0.0-ci') { throw "installed version: $v" }
          # a checksum that does not match: refused, nothing installed
          "$('0' * 64)  $name.tar.gz" | Set-Content -Encoding ascii (Join-Path $rel 'checksums.txt')
          $env:LMGET_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin2'
          $refused = $false
          try { ./site/install.ps1 } catch { $refused = $true; Write-Host "refused as expected: $_" }
          if (-not $refused) { throw 'a bad checksum was accepted' }
          if (Test-Path (Join-Path $env:LMGET_INSTALL_DIR 'lmget.exe')) { throw 'installed despite a bad checksum' }
          Stop-Process -Id $srv.Id

  image:
    # the container image release.yml publishes, built here from this commit
    # and run; nothing is pushed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the binaries the image takes
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/fabriziosalmi/lmget.Version=v0.0.0-ci" \
              -o "dist/linux_$arch/lmget" ./cmd/lmget
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: both platforms build
        run: docker buildx build --platform linux/amd64,linux/arm64 .
      - name: the amd64 image runs, as nonroot, with certificates
        run: |
          docker buildx build --platform linux/amd64 --load -t lmget:ci .
          test "$(docker run --rm lmget:ci --version)" = "lmget v0.0.0-ci"
          test "$(docker image inspect lmget:ci --format '{{.Config.User}}')" = "65532"
          docker run --rm lmget:ci info prajjwal1/bert-tiny --plain 2>&1 | grep -q 'license=mit'

  sbom:
    # lmget sbom writes documents the official CycloneDX 1.6 schema accepts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the bills of materials
        run: |
          go build -o lmget ./cmd/lmget
          ./lmget sbom --lockfile setup/testdata/lmget.lock > one.cdx.json
          ./lmget sbom --lockfile testdata/sbom.lock > kinds.cdx.json
          ! grep -q secretvalue kinds.cdx.json # a signed URL's query never reaches it
      - name: valid against the CycloneDX 1.6 schema, at a fixed commit
        run: |
          c=6470e34ef83f915868ece48934cff52e10c9eb49
          mkdir schema
          for f in bom-1.6.schema.json spdx.schema.json jsf-0.82.schema.json; do
            curl -fsSL -o "schema/$f" "https://raw.githubusercontent.com/CycloneDX/specification/$c/schema/$f"
          done
          python3 -m venv venv # the system Python takes no pip packages (PEP 668)
          venv/bin/pip install --quiet jsonschema==4.23.0
          venv/bin/python scripts/check-cyclonedx.py schema one.cdx.json kinds.cdx.json
