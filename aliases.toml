# The project's nicknames: "lmget qwen" picks the variant for the machine it
# runs on. lmget-index aliases resolves every variant at its source and keeps
# it only if it is not gated, has a license on the allowlist, selects no
# pickle, needs no code from its repository (no auto_map), and matches its
# format. Ollama variants declare their license: the registry gives none.

[qwen]
kind = "chat"
family = "Qwen3.5"

[[qwen.variant]]
ref = "hf:Qwen/Qwen3.5-0.8B"
params = "0.8B"
format = "safetensors"

[[qwen.variant]]
ref = "hf:Qwen/Qwen3.5-2B"
params = "2B"
format = "safetensors"

[[qwen.variant]]
ref = "hf:Qwen/Qwen3.5-4B"
params = "4B"
format = "safetensors"

[[qwen.variant]]
