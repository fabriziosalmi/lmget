params = "9B"
format = "safetensors"

[[qwen.variant]]
ref = "hf:mlx-community/Qwen3.5-0.8B-4bit"
params = "0.8B"
format = "mlx"
quant = "4bit"

[[qwen.variant]]
ref = "hf:mlx-community/Qwen3.5-2B-4bit"
params = "2B"
format = "mlx"
quant = "4bit"

[[qwen.variant]]
ref = "hf:mlx-community/Qwen3.5-9B-4bit"
params = "9B"
format = "mlx"
quant = "4bit"

[[qwen.variant]]
ref = "hf:unsloth/Qwen3.5-0.8B-GGUF"
params = "0.8B"
format = "gguf"
quant = "Q4_0"
include = ["Qwen3.5-0.8B-Q4_0.gguf"]

[[qwen.variant]]
ref = "hf:unsloth/Qwen3.5-2B-GGUF"
params = "2B"
format = "gguf"
